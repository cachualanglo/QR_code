<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Container for centering and width constraint -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.1)] p-lg flex flex-col gap-xl">
<!-- Header Section: Logo & Title -->
<header class="flex flex-col items-center gap-sm">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-[32px]">qr_code_scanner</span>
</div>
<h1 class="text-display font-display text-primary text-center">Chấm Công QR</h1>
<p class="text-body-md font-body-md text-on-surface-variant text-center">Hệ thống quản lý chấm công nội bộ</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-lg" id="loginForm" method="POST">
<!-- Input Fields Group -->
<div class="flex flex-col gap-md">
<!-- Username Field -->
<div class="relative">
<label class="sr-only" for="username">Tên đăng nhập</label>
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-[48px] pr-md py-sm h-[48px] border-outline-variant rounded-lg bg-surface-container-low text-body-lg font-body-lg text-on-surface focus:border-primary focus:ring-primary placeholder:text-outline focus:outline-none focus:ring-1 transition-colors" id="username" name="username" placeholder="Tên đăng nhập" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="relative">
<label class="sr-only" for="password">Mật khẩu</label>
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-[48px] pr-md py-sm h-[48px] border-outline-variant rounded-lg bg-surface-container-low text-body-lg font-body-lg text-on-surface focus:border-primary focus:ring-primary placeholder:text-outline focus:outline-none focus:ring-1 transition-colors" id="password" name="password" placeholder="Mật khẩu" required="" type="password"/>
</div>
</div>
<!-- Error State Example (Hidden by default, can be toggled via JS) -->
<div class="hidden text-error bg-error-container text-on-error-container text-body-md font-body-md p-sm rounded-md flex items-start gap-sm" id="error-message">
<span class="material-symbols-outlined text-[20px]">error</span>
<span>Username hoặc password không đúng</span>
</div>
<!-- Actions Group -->
<div class="flex flex-col gap-md">
<!-- Primary Button (Normal State) -->
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg text-headline-md font-headline-md shadow-[0px_2px_4px_rgba(0,0,0,0.05)] hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98]" id="submit-btn" type="submit">
                    Đăng nhập
                </button>
<!-- Loading State Example (Hidden by default) -->
<button class="hidden w-full h-[48px] bg-primary text-on-primary rounded-lg text-headline-md font-headline-md shadow-[0px_2px_4px_rgba(0,0,0,0.05)] flex items-center justify-center opacity-90 cursor-not-allowed" disabled="" id="loading-btn" type="button">
<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
                    Đang xử lý...
                </button>
</div>
<div class="text-center mt-sm">
<a class="text-body-md font-body-md text-primary hover:underline" href="#">Quên mật khẩu?</a>
</div>
</form>
</main>
<!-- Basic JS for demonstrating states -->
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent actual submission
            
            const submitBtn = document.getElementById('submit-btn');
            const loadingBtn = document.getElementById('loading-btn');
            const errorMsg = document.getElementById('error-message');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // Hide error if visible
            errorMsg.classList.add('hidden');
            
            // Show loading
            submitBtn.classList.add('hidden');
            loadingBtn.classList.remove('hidden');
            usernameInput.disabled = true;
            passwordInput.disabled = true;

            // Simulate API call
            setTimeout(() => {
                // Restore form
                submitBtn.classList.remove('hidden');
                loadingBtn.classList.add('hidden');
                usernameInput.disabled = false;
                passwordInput.disabled = false;
                
                // Show error state for demonstration
                errorMsg.classList.remove('hidden');
            }, 2000);
        });
    </script>
</body></html>
