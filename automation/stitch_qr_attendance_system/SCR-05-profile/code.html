<body class="bg-background text-on-surface h-screen flex flex-col md:hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-16 px-margin-mobile w-full bg-surface shadow-sm docked full-width top-0 z-50">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary text-on-primary font-headline-md">
            NV
        </div>
<h1 class="text-headline-lg font-headline-lg font-bold text-primary">Cá nhân</h1>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors active:scale-95 transition-transform rounded-full">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile py-lg pb-[80px] space-y-lg">
<!-- User Info Header -->
<section class="flex flex-col items-center justify-center space-y-sm py-md">
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-on-primary mb-xs">
<span class="material-symbols-outlined" style="font-size: 32px;">person</span>
</div>
<span class="text-label-bold font-label-bold text-primary uppercase">NV001</span>
<h2 class="text-headline-md font-headline-md text-on-surface">Nguyễn Văn A</h2>
</section>
<!-- Info List Card -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_2px_4px_rgba(0,0,0,0.05)] border border-outline-variant/30">
<div class="flex flex-col">
<!-- Row 1 -->
<div class="flex items-center justify-between py-md">
<div class="flex items-center space-x-md text-on-surface-variant">
<span class="material-symbols-outlined text-secondary">person</span>
<span class="text-body-md font-body-md">Họ tên</span>
</div>
<span class="text-body-md font-body-md font-medium text-on-surface">Nguyễn Văn A</span>
</div>
<div class="h-px w-full bg-outline-variant"></div>
<!-- Row 2 -->
<div class="flex items-center justify-between py-md">
<div class="flex items-center space-x-md text-on-surface-variant">
<span class="material-symbols-outlined text-secondary">badge</span>
<span class="text-body-md font-body-md">Mã nhân viên</span>
</div>
<span class="text-body-md font-body-md font-medium text-on-surface">NV001</span>
</div>
<div class="h-px w-full bg-outline-variant"></div>
<!-- Row 3 -->
<div class="flex items-center justify-between py-md">
<div class="flex items-center space-x-md text-on-surface-variant">
<span class="material-symbols-outlined text-secondary">business_center</span>
<span class="text-body-md font-body-md">Bộ phận</span>
</div>
<span class="text-body-md font-body-md font-medium text-on-surface">Phòng Kỹ thuật</span>
</div>
<div class="h-px w-full bg-outline-variant"></div>
<!-- Row 4 -->
<div class="flex items-center justify-between py-md">
<div class="flex items-center space-x-md text-on-surface-variant">
<span class="material-symbols-outlined text-secondary">email</span>
<span class="text-body-md font-body-md">Email</span>
</div>
<span class="text-body-md font-body-md font-medium text-on-surface">nv001@company.com</span>
</div>
<div class="h-px w-full bg-outline-variant"></div>
<!-- Row 5 -->
<div class="flex items-center justify-between pt-md">
<div class="flex items-center space-x-md text-on-surface-variant">
<span class="material-symbols-outlined text-secondary">phone</span>
<span class="text-body-md font-body-md">Số điện thoại</span>
</div>
<span class="text-body-md font-body-md font-medium text-on-surface">0901 234 567</span>
</div>
</div>
</div>

<div class="pt-lg">
<button class="w-full h-12 flex items-center justify-center space-x-sm bg-error-container text-error rounded-xl active:scale-[0.98] transition-transform shadow-[0px_4px_12px_rgba(0,0,0,0.1)]">
<span class="material-symbols-outlined">logout</span>
<span class="text-body-lg font-body-lg font-medium">Đăng xuất</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full flex justify-around items-center bg-surface pb-safe border-t border-outline-variant docked full-width z-50 h-[56px]">
<!-- Inactive -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-high transition-colors active:scale-90 transition-transform duration-200 w-full h-full">
<span class="material-symbols-outlined">qr_code_scanner</span>
<span class="text-label-md font-label-md mt-1">Check-in</span>
</button>
<!-- Inactive -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-surface-container-high transition-colors active:scale-90 transition-transform duration-200 w-full h-full">

<span class="text-label-md font-label-md mt-1">Thống kê</span>
</button>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-md font-label-md mt-1">Cá nhân</span>
</button>
