<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
            /* Mobile first setup */
            margin: 0 auto;
            max-width: 375px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-overlay {

        }

<!-- App Content (Underneath Modal) -->
<div class="flex-1 flex flex-col pointer-events-none">

<header class="flex justify-between items-center h-16 px-margin-mobile w-full bg-surface dark:bg-surface-container-highest shadow-sm docked full-width top-0 z-10 text-primary dark:text-primary-fixed">

                NV
            </div>
<h1 class="text-headline-lg font-headline-lg font-bold text-primary dark:text-primary-fixed">Cá nhân</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 text-primary">

<div class="w-full h-32 bg-surface-container rounded-lg opacity-30"></div>
<div class="w-full h-16 bg-surface-container rounded-lg opacity-30"></div>
<div class="w-full h-16 bg-surface-container rounded-lg opacity-30"></div>

</main>

<div class="absolute inset-0 z-40 modal-overlay flex items-center justify-center p-margin-mobile pb-24">

<div class="bg-surface-container-lowest w-full rounded-xl p-lg shadow-[0px_4px_12px_rgba(0,0,0,0.1)] flex flex-col items-center text-center transform transition-all duration-300 scale-100">
<!-- Icon -->
<div class="mb-lg text-error">
<span class="material-symbols-outlined !text-[64px] leading-none" data-icon="logout" style="font-variation-settings: 'FILL' 0;">logout</span>
</div>
<!-- Text Content -->
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-sm">Đăng xuất</h2>
<p class="text-body-md font-body-md text-on-surface-variant mb-lg">Bạn có chắc muốn đăng xuất khỏi hệ thống?</p>

<button class="flex-1 bg-surface-container text-primary font-label-bold py-[12px] px-lg rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 h-[48px] flex items-center justify-center">

                </button>
<button class="flex-1 bg-error text-on-error font-label-bold py-[12px] px-lg rounded-lg hover:bg-red-800 transition-colors active:scale-95 shadow-[0px_2px_4px_rgba(0,0,0,0.05)] h-[48px] flex items-center justify-center">
                    Đồng ý
                </button>
</div>
</div>
</div>

<nav class="fixed bottom-0 w-full max-w-[375px] flex justify-around items-center bg-surface dark:bg-surface-container-low pb-safe border-t border-outline-variant dark:border-outline h-[56px] z-50">

<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-90 w-16 h-full">

</button>
<!-- Inactive Tab: Thống kê -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-90 w-16 h-full">
<span class="material-symbols-outlined mb-1" data-icon="calendar_month">calendar_month</span>
<span class="text-label-md font-label-md">Thống kê</span>
</button>

<button class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold hover:bg-surface-container-high transition-colors active:scale-90 w-16 h-full">
<span class="material-symbols-outlined mb-1" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="text-label-md font-label-md text-primary font-bold">Cá nhân</span>
</button>
