# application-local.yml — Backend chạy ngoài Docker, DB host = localhost
jwt:
  secret: ${JWT_SECRET:dev-only-local-secret-not-for-production-min-32-chars!!}

spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:attendance_db}
    username: ${POSTGRES_USER:attendance_user}
    password: ${POSTGRES_PASSWORD:attendance_pass}
  jpa:
    show-sql: true
