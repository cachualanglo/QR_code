# MCP Capability (local export mode)
mcp_capability:
  mode: "local-export"
  provides:
    - "full HTML with Tailwind CSS"
    - "screen screenshot (PNG)"
    - "color tokens (Material Design 3)"
    - "typography tokens (Inter font)"
    - "spacing tokens"
    - "border radius tokens"
  does_not_provide:
    - "live Stitch API access"
    - "real-time screen sync"
    - "Stitch project metadata"
  fallback: "Use code.html + screen.png as visual source of truth"
