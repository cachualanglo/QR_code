openapi: 3.0.3
info:
  title: Chấm Công QR API
  description: |
    API cho hệ thống chấm công bằng QR code + GPS.
    Module: MOD-01 Chấm công QR
    
    ## Xác thực
    - Mọi endpoint trừ `/api/auth/login` yêu cầu JWT Bearer token
    - JWT chứa: userId, employeeCode, role
    
    ## RBAC
    - EMPLOYEE: Chỉ xem dữ liệu của chính mình (PERM-01)
    - ADMIN: Quản lý company_location
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Xác thực & JWT
  - name: Checkin
    description: Chấm công QR
  - name: Stats
    description: Thống kê chấm công
  - name: Admin
    description: Quản trị (ADMIN only)

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: auth.login
      summary: Đăng nhập
      description: |
        Xác thực bằng username + password.
        Trả về access token (30 phút) và refresh token (7 ngày).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Sai username hoặc password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: auth.refresh
      summary: Làm mới access token
      description: |
        Sử dụng refresh token để lấy access token mới.
        Refresh token hợp lệ trong 7 ngày.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token không hợp lệ hoặc hết hạn

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: auth.logout
      summary: Đăng xuất
      description: |
        Thu hồi refresh token phía server.
        Client phải xóa JWT local sau khi gọi API này.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đăng xuất thành công"
        '401':
          description: Token không hợp lệ

  /api/checkin:
    post:
      tags: [Checkin]
      operationId: checkin.submit
      summary: Chấm công QR
      description: |
        Quét QR code và xác thực GPS.
        
        **Logic:**
        - Lần 1 trong ngày → CHECK_IN
        - Lần 2 trong ngày → CHECK_OUT
        - Lần 3+ → Từ chối (ALREADY_COMPLETED)
        
        **GPS Validation:**
        - Tính khoảng cách Haversine từ vị trí hiện tại đến company_location
        - Nếu > radius_meters → từ chối (LOCATION_OUT_OF_RANGE)
        
        **Quy tắc:**userId lấy từ JWT, không nhận từ client (PERM-01)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinRequest'
      responses:
        '200':
          description: Chấm công thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResponse'
        '401':
          description: Token không hợp lệ
        '403':
          description: Ngoài bán kính cho phép
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Đã hoàn tất chấm công hôm nay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/stats:
    get:
      tags: [Stats]
      operationId: stats.list
      summary: Thống kê chấm công
      description: |
        Hiển thị lịch chấm công theo tuần hoặc tháng.
        
        **Modes:**
        - `week`: 7 ngày của tuần chứa date
        - `month`: Tất cả ngày trong tháng chứa date
        
        **Trạng thái:**
        - ON_TIME: Check-in ≤ 08:30
        - LATE: Check-in > 08:30
        - ABSENT: Ngày làm việc (T2-T6) không có check-in
        - DAY_OFF: T7, CN
        - MISSING_CHECKOUT: Có check-in nhưng chưa check-out
      security:
        - bearerAuth: []
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [week, month]
        - name: date
          in: query
          required: true
          description: "YYYY-MM-DD"
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Danh sách thống kê
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DayStats'

  /api/stats/day/{date}:
    get:
      tags: [Stats]
      operationId: stats.dayDetail
      summary: Chi tiết 1 ngày
      description: |
        Hiển thị giờ vào, giờ ra, toạ độ và khoảng cách.
       userId lấy từ JWT (PERM-01).
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          description: "YYYY-MM-DD"
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Chi tiết ngày
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayDetail'
        '404':
          description: Không có dữ liệu

  /api/admin/company-location:
    put:
      tags: [Admin]
      operationId: admin.updateLocation
      summary: Cập nhật toạ độ công ty
      description: |
        Chỉ ADMIN mới có quyền.
        Dùng khi cần thay đổi vị trí công ty hoặc bán kính.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          description: Token không hợp lệ
        '403':
          description: Không có quyền ADMIN

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token TTL in seconds (1800 = 30 min)

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    CheckinRequest:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
          description: Vĩ độ hiện tại
        lng:
          type: number
          format: double
          description: Kinh độ hiện tại
        accuracy:
          type: number
          format: double
          description: Độ chính xác GPS (meters)

    CheckinResponse:
      type: object
      properties:
        ok:
          type: boolean
        action:
          type: string
          enum: [CHECK_IN, CHECK_OUT]
        message:
          type: string
        distanceMeters:
          type: number
          format: double

    DayStats:
      type: object
      properties:
        date:
          type: string
          format: date
        checkInTime:
          type: string
          format: date-time
          nullable: true
        checkOutTime:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ON_TIME, LATE, ABSENT, DAY_OFF, MISSING_CHECKOUT]

    DayDetail:
      type: object
      properties:
        date:
          type: string
          format: date
        checkInTime:
          type: string
          format: date-time
          nullable: true
        checkOutTime:
          type: string
          format: date-time
          nullable: true
        checkInLat:
          type: number
          format: double
          nullable: true
        checkInLng:
          type: number
          format: double
          nullable: true
        checkInDistanceM:
          type: number
          format: double
          nullable: true
        checkOutLat:
          type: number
          format: double
          nullable: true
        checkOutLng:
          type: number
          format: double
          nullable: true
        checkOutDistanceM:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum: [ON_TIME, LATE, ABSENT, DAY_OFF, MISSING_CHECKOUT]

    UpdateLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        radiusMeters:
          type: integer
          default: 10

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
